<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Yanda's Blog</title>
  <link rel="stylesheet" href="style_blog.css" />
</head>
<body>

  <!-- 🔹 动态导航栏 -->
  <div id="navbar-placeholder"></div>
  <script>
    fetch('navbar.html')
      .then(res => res.text())
      .then(data => {
        document.getElementById('navbar-placeholder').innerHTML = data;
        // navbar 加载完成后，触发语言按钮事件绑定
        if (window.attachLanguageButtonListeners) {
          window.attachLanguageButtonListeners();
        }
      });
  </script>

  <!-- 🔸 双栏博客主区域 -->
  <div class="blog-container" style="display: flex; gap: 40px; align-items: flex-start; flex-wrap: wrap;">
    
    <!-- ⬅ 左栏：分类结构 -->
    <div style="flex: 1; min-width: 320px;">
      <h1 class="blog-title">📚 <span data-i18n="blog.title">Yanda's Blog</span></h1>
      <p class="blog-subtitle" data-i18n="blog.subtitle">Browse posts by category</p>
      <div id="blog-category-list"></div>
    </div>

    <!-- ➡ 右栏：时间线结构 -->
    <div style="flex: 1; min-width: 320px;">
      <h2>🕒 <span data-i18n="blog.timeline">Sorted by date</span></h2>
      <div id="blog-timeline-list"></div>
    </div>

  </div>

  <!-- 🔻 Footer -->
  <div class="footer">
    <span data-i18n="blog.footer.copyright">Blog © Yanda Cheng</span> | <span data-i18n="blog.footer.updated">Last updated</span> May 2025
  </div>

  <!-- 🔧 渲染脚本 -->
  <script src="scripts/render_blog_dual.js"></script>

  <!-- 🌐 i18n 翻译脚本 -->
  <script src="scripts/i18n.js"></script>

</body>
</html>
